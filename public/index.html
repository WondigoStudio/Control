<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Статус · Пульт наблюдения</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scanline"></div>

  <header class="topbar">
    <div class="topbar__brand">
      <span class="topbar__dot" id="globalDot"></span>
      <span class="topbar__title">ПУЛЬТ&nbsp;НАБЛЮДЕНИЯ</span>
    </div>
    <div class="topbar__meta">
      <span id="clock">--:--:--</span>
      <span class="divider">/</span>
      <span id="summaryText">загрузка…</span>
      <button class="sort-btn" id="sortBtn">по надёжности</button>
      <button class="sort-btn" id="addMonitorBtn">+ добавить</button>
      <button class="sort-btn" id="logoutBtn">выйти</button>
    </div>
  </header>

  <div class="summary-bar" id="summaryBar" hidden></div>

  <main class="grid" id="grid">
    <!-- карточки мониторов рендерятся сюда -->
  </main>

  <div class="detail" id="monitorFormModal" hidden>
    <div class="detail__panel">
      <button class="detail__close" id="monitorFormClose">×</button>
      <h2 id="monitorFormTitle">Новый монитор</h2>

      <form id="monitorForm">
        <div class="form-row">
          <label>Название</label>
          <input type="text" id="f_name" required placeholder="Мой сайт">
        </div>

        <div class="form-row">
          <label>ID (латиница, цифры, дефис)</label>
          <input type="text" id="f_id" required placeholder="my-site" pattern="[a-z0-9-]+">
        </div>

        <div class="form-row">
          <label>Тип</label>
          <select id="f_type">
            <option value="http">Сайт (HTTP)</option>
            <option value="telegram_bot">Telegram-бот</option>
          </select>
        </div>

        <div class="form-row" id="row_url">
          <label>URL</label>
          <input type="text" id="f_url" placeholder="https://example.com">
        </div>

        <div class="form-row" id="row_botToken" hidden>
          <label>Токен бота</label>
          <input type="text" id="f_botToken" placeholder="123456:AAH...">
        </div>

        <div class="form-row">
          <label>Интервал проверки (сек)</label>
          <input type="number" id="f_intervalSec" value="60" min="10">
        </div>

        <div class="form-row">
          <label>Таймаут (мс)</label>
          <input type="number" id="f_timeoutMs" value="8000" min="1000">
        </div>

        <div class="form-row" id="row_expectedStatus">
          <label>Ожидаемый HTTP-статус</label>
          <input type="number" id="f_expectedStatus" value="200">
        </div>

        <div class="form-row" id="row_expectedContent">
          <label>Ожидаемый текст на странице (опционально)</label>
          <input type="text" id="f_expectedContent" placeholder="">
        </div>

        <div class="form-row" id="row_expectedContentAbsent">
          <label>Запрещённые фразы на странице (через запятую, опционально)</label>
          <input type="text" id="f_expectedContentAbsent" placeholder="Database error, Account suspended">
        </div>

        <div class="form-row">
          <label>Хостинг</label>
          <select id="f_hosting">
            <option value="other">Другой / не указан</option>
            <option value="render">Render</option>
            <option value="infinityfree">InfinityFree</option>
            <option value="hidden_cloud">Hidden Cloud</option>
            <option value="vps">VPS</option>
          </select>
        </div>

        <div class="form-row">
          <label>Автовосстановление</label>
          <select id="f_recoveryProvider">
            <option value="none">Нет (только диагностика)</option>
            <option value="render">Render Deploy Hook</option>
          </select>
        </div>

        <div id="recoveryFields" hidden>
          <div class="form-row" id="row_deployHookUrl">
            <label>Deploy Hook URL</label>
            <input type="text" id="f_deployHookUrl" placeholder="https://api.render.com/deploy/...">
          </div>
          <div class="form-row">
            <label>Перезапуск после N падений подряд</label>
            <input type="number" id="f_afterFails" value="3" min="1">
          </div>
          <div class="form-row">
            <label>Макс. попыток за одно падение</label>
            <input type="number" id="f_maxAttempts" value="2" min="1">
          </div>
          <div class="form-row">
            <label>Макс. перезапусков в час</label>
            <input type="number" id="f_maxPerHour" value="5" min="1">
          </div>
        </div>

        <div class="form-row">
          <label>Резервный адрес (Failover, опционально)</label>
          <input type="text" id="f_backupUrl" placeholder="https://резервный-адрес.example.com">
        </div>

        <div class="form-row">
          <label>
            <input type="checkbox" id="f_flappingEnabled" checked style="width:auto;display:inline-block;margin-right:6px;">
            Flapping detection (сводное уведомление вместо спама при нестабильности)
          </label>
        </div>

        <div id="flappingFields">
          <div class="form-row">
            <label>Окно наблюдения (минут)</label>
            <input type="number" id="f_flappingWindow" value="10" min="1">
          </div>
          <div class="form-row">
            <label>Порог (сколько падений за окно = flapping)</label>
            <input type="number" id="f_flappingThreshold" value="3" min="2">
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary">Сохранить</button>
          <button type="button" class="btn-danger" id="deleteMonitorBtn" hidden>Удалить</button>
        </div>
        <div class="form-error" id="formError"></div>
      </form>
    </div>
  </div>

  <div class="detail" id="detail" hidden>
    <div class="detail__panel">
      <button class="detail__close" id="detailClose">×</button>
      <button class="sort-btn edit-monitor-btn" id="editMonitorBtn">✏️ редактировать</button>
      <button class="sort-btn maintenance-btn" id="maintenanceBtn">🔧 обслуживание</button>
      <h2 id="detailTitle">—</h2>
      <div class="detail__row" id="detailMeta"></div>

      <div id="checkNowSection">
        <button class="sort-btn" id="checkNowBtn">🔍 Проверить сейчас (подробно)</button>
        <div id="checkNowResult" class="check-now-result" hidden></div>
      </div>

      <div class="period-switch" id="periodSwitch">
        <button data-hours="24" class="active">24ч</button>
        <button data-hours="168">7д</button>
        <button data-hours="720">30д</button>
      </div>

      <div class="detail__stats" id="detailStats"></div>

      <div id="sslBox" class="ssl-box" hidden></div>

      <div id="botHealthBox" class="ssl-box ok" hidden></div>

      <div id="timingBox" class="timing-box" hidden></div>

      <div class="chart-toolbar">
        <span class="chart-hint">🖱️ выдели отрезок мышью для увеличения</span>
        <button class="sort-btn" id="resetZoomBtn" hidden>🔍 сбросить масштаб</button>
      </div>
      <div class="detail__chart">
        <svg id="detailChart" viewBox="0 0 640 160" preserveAspectRatio="none"></svg>
      </div>

      <h3 class="section-label">Аптайм за 90 дней</h3>
      <div class="heatmap" id="heatmap"></div>

      <h3 class="section-label">Инциденты</h3>
      <div class="incidents" id="detailIncidents"></div>

      <div id="restartsSection" hidden>
        <h3 class="section-label">Попытки автоперезапуска</h3>
        <div class="incidents" id="detailRestarts"></div>
      </div>

      <div id="locationsSection">
        <h3 class="section-label">Проверка из разных локаций</h3>
        <button class="sort-btn" id="checkLocationsBtn">🌍 Проверить сейчас</button>
        <div id="locationsResults" class="locations-grid"></div>
      </div>

      <h3 class="section-label">Последние проверки</h3>
      <div class="detail__log" id="detailLog"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
